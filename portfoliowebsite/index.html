<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile</title>


<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Prompt", sans-serif;
    }

    
    body {
        background: linear-gradient(135deg, #e0eafc, #cfdef3);
        background-size: 400% 400%;
        animation: gradientShift 10s ease infinite;
        color: #222;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    
    nav {
        background: rgba(0, 0, 0, 0.85);
        padding: 1rem 2rem;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        width: 100%;
        position: sticky;
        top: 0;
        z-index: 10;
        backdrop-filter: blur(8px);
    }

    .menu ul {
        display: flex;
        list-style: none;
        justify-content: flex-end;
        align-items: center;
        gap: 2rem;
    }

    .menu a {
        text-decoration: none;
        color: white;
        font-size: 1.1rem;
        font-weight: 500;
        position: relative;
        transition: color 0.3s ease;
    }

    .menu a::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -6px;
        width: 0%;
        height: 2px;
        background: #ffd700;
        transition: width 0.3s ease;
    }

    .menu a:hover {
        color: #ffd700;
    }

    .menu a:hover::after {
        width: 100%;
    }

    
    .img {
        display: flex;
        justify-content: center;
        margin-top: 3rem;
        animation: fadeIn 1.2s ease;
    }

    .img img {
        width: 250px;
        height: 250px;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
        transition: transform 0.4s ease, box-shadow 0.4s ease;
        border: 4px solid rgba(255, 255, 255, 0.6);
    }

    .img img:hover {
        transform: scale(1.08);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    }

    
    .a {
        margin-top: 2.5rem;
        background: rgba(255, 255, 255, 0.6);
        width: 65%;
        padding: 2rem;
        border-radius: 25px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        line-height: 1.8;
        font-size: 1.1rem;
        text-align: center;
        backdrop-filter: blur(15px);
        animation: slideUp 1.5s ease;
    }

    .a h3 {
        margin-bottom: 0.6rem;
        color: #444;
    }

    .a h3:first-child {
        font-size: 1.4rem;
        font-weight: 600;
        color: #ff6a00;
    }

    .a h3:last-child {
        font-style: italic;
        color: #333;
        background: linear-gradient(90deg, #ee0979, #ff6a00);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    
    @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(40px); }
        to { opacity: 1; transform: translateY(0); }
    }

   
    @media (max-width: 768px) {
        .a {
            width: 85%;
            font-size: 1rem;
            padding: 1.5rem;
        }

        .img img {
            width: 200px;
            height: 200px;
        }
    }
</style>
</head>

<body>

    <nav>
        <div class="menu">
            <ul>
                <li><a href="index.html">PROFILE</a></li>
                <li><a href="education.html">EDUCATION</a></li>
                <li><a href="certificate.html">CERTIFICATES</a></li>
                <li><a href="blog.html">BLOG</a></li>
                <li><a href="contact.html">CONTACT</a></li>
            </ul>
        </div>
    </nav>

    <div class="img">
        <img src="img/me.jpg" alt="Profile Picture">
    </div>

    <div class="a">
        <h3>ชื่อ-นามสกุล : ธนวิชญ์ ดอบุตร</h3>
        <h3>ชื่อเล่น : ทีม</h3>
        <h3>วันเกิด : 20 กรกฎาคม 2547</h3>
        <h3>อายุ : 21 ปี</h3>
        <h3>สัญชาติ : ไทย | เชื้อชาติ : ไทย</h3>
        <h3>ศาสนา : พุทธ</h3>
        <h3>คติประจำใจ : คนที่ถอยออกมาไม่ใช่คนที่แพ้ แต่มันเป็นคนที่เข้าผิดซอย</h3>
    </div>

  

</body>
</html>
